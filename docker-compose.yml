services:
  lifeticket:
    build: .
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - lifeticket-data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=sqlite:////data/lifeticket.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - RADICALE_URL=http://radicale:5232
      - RADICALE_USER=${RADICALE_USER:-lifeticket}
      - RADICALE_PASSWORD=${RADICALE_PASSWORD:-lifeticket}
    depends_on:
      - radicale
    restart: unless-stopped

  radicale:
    image: tomsquest/docker-radicale:latest
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - radicale-data:/data
      - ./radicale:/config:ro
    restart: unless-stopped

volumes:
  lifeticket-data:
  radicale-data:
