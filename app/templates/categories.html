{% extends "base.html" %}
{% block title %}Categories — LifeTicket{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">Categories</h1>

    <!-- Add Category -->
    <form method="POST" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border dark:border-gray-700 p-4 mb-6">
        <div class="flex items-end gap-3">
            <div class="flex-1">
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">New Category</label>
                <input type="text" name="name" id="name" required
                       class="w-full border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg shadow-sm focus:ring-brand-500 focus:border-brand-500 text-sm px-3 py-2 border"
                       placeholder="e.g. Chores, Gig Work">
            </div>
            <div>
                <label for="color" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Color</label>
                <input type="color" name="color" id="color" value="#6366f1"
                       class="w-10 h-9 rounded border border-gray-300 dark:border-gray-600 cursor-pointer">
            </div>
            <button type="submit" class="bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-brand-700 transition">Add</button>
        </div>
    </form>

    <!-- Category List -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border dark:border-gray-700 divide-y dark:divide-gray-700">
        {% for cat in categories %}
        <div class="flex items-center gap-3 px-5 py-3">
            <span class="w-4 h-4 rounded-full flex-shrink-0" style="background: {{ cat.color }}"></span>
            <span class="font-medium text-gray-900 dark:text-white flex-1">{{ cat.name }}</span>
            <span class="text-sm text-gray-500 dark:text-gray-400">{{ cat.tickets | length }} tickets</span>
            <form method="POST" action="/categories/{{ cat.id }}/delete" onsubmit="return confirm('Delete this category?')">
                <button type="submit" class="text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 text-sm">Delete</button>
            </form>
        </div>
        {% else %}
        <div class="px-5 py-8 text-center text-gray-400 text-sm">
            No categories yet. Add one above!
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
