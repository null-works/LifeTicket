<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
  <!-- Background -->
  <rect width="512" height="512" fill="#4f46e5"/>

  <!-- Calendar body -->
  <g transform="translate(80, 88)">
    <!-- Calendar sheet -->
    <rect x="0" y="40" width="352" height="280" rx="24" fill="white" opacity="0.95"/>

    <!-- Top red bar (month header) -->
    <rect x="0" y="40" width="352" height="72" rx="24" fill="#ef4444"/>
    <rect x="0" y="88" width="352" height="24" fill="#ef4444"/>

    <!-- Calendar rings -->
    <rect x="96" y="16" width="24" height="56" rx="12" fill="white" opacity="0.9"/>
    <rect x="232" y="16" width="24" height="56" rx="12" fill="white" opacity="0.9"/>

    <!-- Month text dots (stylized "text") -->
    <line x1="120" y1="80" x2="232" y2="80" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

    <!-- Calendar grid dots (cute rounded squares) -->
    <!-- Row 1 -->
    <rect x="36" y="136" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="92" y="136" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="148" y="136" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="204" y="136" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="260" y="136" width="32" height="32" rx="8" fill="#e0e7ff"/>

    <!-- Row 2 -->
    <rect x="36" y="188" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="92" y="188" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="148" y="188" width="32" height="32" rx="8" fill="#4f46e5"/>
    <rect x="204" y="188" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="260" y="188" width="32" height="32" rx="8" fill="#e0e7ff"/>

    <!-- Row 3 -->
    <rect x="36" y="240" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="92" y="240" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="148" y="240" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="204" y="240" width="32" height="32" rx="8" fill="#e0e7ff"/>
    <rect x="260" y="240" width="32" height="32" rx="8" fill="#e0e7ff"/>

    <!-- Checkmark on the highlighted date -->
    <polyline points="155,200 163,210 177,194" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
